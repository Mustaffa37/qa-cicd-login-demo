name: QA Automation CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pytest requests pytest-html pytest-playwright python-dotenv

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Start FastAPI Backend Server
      env:
        MOCK_EMAIL: ${{ secrets.MOCK_EMAIL }}
        MOCK_PASSWORD: ${{ secrets.MOCK_PASSWORD }}
      run: |
        uvicorn main:app --host 127.0.0.1 --port 8000 &
        sleep 5

    - name: Run Pytest Automation Suite (API & UI)
      env:
        BASE_URL: "http://127.0.0.1:8000"
        TEST_USER_EMAIL: ${{ secrets.MOCK_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.MOCK_PASSWORD }}
      run: |
        pytest tests/ --html=report.html --self-contained-html

    - name: Upload HTML Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-execution-report
        path: report.html